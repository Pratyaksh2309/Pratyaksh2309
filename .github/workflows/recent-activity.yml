name: Update README with recent activity
on:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours (00:00, 12:00 UTC)
  workflow_dispatch:         # allow manual runs
permissions:
  contents: write
jobs:
  update-activity:
    runs-on: ubuntu-latest
    steps:
      - uses: Readme-Workflows/recent-activity@v2
        with:
          COMMIT_MSG: "chore: update recent activity (12h)"
